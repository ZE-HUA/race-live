<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Race Live 多人即時位置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css">
<style>
  :root { --bg:#111; --fg:#f5f5f5; --muted:#9a9a9a; --card:rgba(20,20,20,.88); --accent:#ffcc00; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; }
  #map { position:fixed; inset:0; }

  /* 加入畫面 */
  #join { position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 20%,#2a2a2a,#0b0b0b); padding:24px; }
  #join form { width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px; }
  #join h1 { margin:0 0 4px; font-size:28px; letter-spacing:.5px; }
  #join h1 span { color:var(--accent); }
  #join p { margin:0 0 8px; color:var(--muted); font-size:14px; line-height:1.5; }
  #join label { font-size:13px; color:var(--muted); }
  #join input { width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#1b1b1b;
    color:var(--fg); font-size:17px; margin-top:4px; }
  #join button { padding:15px; border:0; border-radius:12px; background:var(--accent); color:#111;
    font-size:17px; font-weight:700; margin-top:6px; }
  #joinErr { color:#ff6b6b; font-size:14px; min-height:1em; }

  /* 頂部狀態列 */
  #top { position:fixed; z-index:1000; top:calc(env(safe-area-inset-top) + 10px); left:10px; right:10px;
    display:flex; gap:8px; align-items:center; pointer-events:none; }
  .pill { pointer-events:auto; background:var(--card); border-radius:999px; padding:8px 12px; font-size:13px;
    backdrop-filter:blur(8px); white-space:nowrap; }
  #conn::before { content:"●"; margin-right:6px; color:#ff6b6b; }
  #conn.ok::before { color:#3cdc6c; }
  #top .spacer { flex:1; }
  #roomPill { min-width:0; overflow:hidden; text-overflow:ellipsis; border:0; color:var(--fg); display:flex; align-items:center; gap:6px; }
  #roomPill #roomName { overflow:hidden; text-overflow:ellipsis; }
  #roomPill .x { flex:none; background:rgba(255,255,255,.14); border-radius:999px; padding:2px 8px; font-size:12px; }
  body.replaying #roomPill { display:none; }
  #conn { flex:none; }
  #conn.ok { font-size:0; padding:8px 11px; }
  #conn.ok::before { font-size:13px; margin:0; }
  #roomPill #roomName { min-width:2.5em; }
  .btn { white-space:nowrap; flex:none; pointer-events:auto; border:0; background:var(--card); color:var(--fg); border-radius:999px;
    padding:8px 12px; font-size:13px; backdrop-filter:blur(8px); }
  .btn.on { background:var(--accent); color:#111; }

  /* 底部：我的車速 + 排行 */
  #bottom { position:fixed; z-index:1000; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom) + 10px);
    display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  #hud { pointer-events:auto; background:var(--card); border-radius:18px; padding:10px 16px;
    display:flex; align-items:baseline; gap:10px; backdrop-filter:blur(8px); }
  #mySpeed { font-size:52px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  #hud .unit { color:var(--muted); font-size:15px; }
  #hud .meta { margin-left:auto; text-align:right; font-size:12px; color:var(--muted); line-height:1.5; }
  #list, #rpList { pointer-events:auto; background:var(--card); border-radius:18px; padding:6px; max-height:32vh;
    overflow:auto; backdrop-filter:blur(8px); }
  #list:empty, #rpList:empty { display:none; }

  /* 記錄 */
  #recBar { display:flex; gap:8px; pointer-events:auto; }
  #recBtn { flex:1; padding:12px; font-size:15px; font-weight:700; border-radius:14px; }
  #histBtn { padding:12px 16px; font-size:15px; border-radius:14px; }
  #recBtn.on-rec { background:#e53935; color:#fff; animation:pulse 1.6s infinite; }
  #recBtn.other { background:rgba(229,57,53,.22); color:#ff8a80; }
  @keyframes pulse { 50% { opacity:.72; } }
  #toast { position:fixed; z-index:3000; left:50%; top:calc(env(safe-area-inset-top) + 64px); transform:translateX(-50%);
    background:#fff; color:#111; padding:10px 16px; border-radius:12px; font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.4);
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }

  /* 紀錄清單 */
  #sheet { position:fixed; inset:0; z-index:2500; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
  #sheet.hidden { display:none; }
  #sheet .card { width:100%; max-height:80vh; overflow:auto; background:#181818; border-radius:20px 20px 0 0;
    padding:16px 14px calc(env(safe-area-inset-bottom) + 16px); }
  #sheet .head { display:flex; align-items:center; margin-bottom:8px; }
  #sheet .head b { flex:1; font-size:18px; }
  .sess { background:#232323; border-radius:14px; padding:12px; margin-bottom:10px; }
  .sess .t { font-weight:700; font-size:16px; }
  .sess .m { color:var(--muted); font-size:13px; margin:4px 0 10px; }
  .sess .acts { display:flex; gap:8px; flex-wrap:wrap; }
  .sess .acts .btn { background:#333; padding:8px 14px; font-size:14px; }
  .sess .acts .btn.primary { background:var(--accent); color:#111; font-weight:700; }
  .sess .acts .btn.danger { color:#ff8a80; margin-left:auto; }
  .hint { color:var(--muted); font-size:12px; line-height:1.5; }

  /* 回放 */
  #replay { position:fixed; z-index:1000; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom) + 10px);
    display:flex; flex-direction:column; gap:8px; }
  body:not(.replaying) #replay { display:none; }
  body.replaying #bottom, body.replaying #followBtn, body.replaying #join { display:none !important; }
  body.replaying .car:not(.rp) { display:none; }
  .rpctl { background:var(--card); border-radius:18px; padding:10px 14px; backdrop-filter:blur(8px); }
  .rpctl .r1 { display:flex; align-items:center; gap:8px; }
  .rpctl .r1 b { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rpctl .r2 { display:flex; align-items:center; gap:10px; }
  #rpPlay { width:46px; height:46px; border-radius:50%; background:var(--accent); color:#111; font-size:18px; padding:0; }
  #rpTime { flex:1; font-variant-numeric:tabular-nums; font-size:14px; }
  #rpSlider { width:100%; margin:12px 0 8px; accent-color:var(--accent); }
  .row.following { outline:2px solid var(--accent); }
  .row .name small.stat { display:block; margin:2px 0 0; font-size:11px; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; }
  .row:active { background:rgba(255,255,255,.08); }
  .row .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .name small { color:var(--muted); margin-left:6px; }
  .row .spd { font-weight:700; font-variant-numeric:tabular-nums; }
  .row.stale { opacity:.45; }

  /* 地圖上的車子標記 */
  .car { position:relative; width:0; height:0; }
  .car .arrow { position:absolute; left:-13px; top:-13px; width:26px; height:26px; border-radius:50%;
    background:var(--c); border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; }
  .car .arrow svg { width:16px; height:16px; display:block; }
  .car.noheading .arrow svg { display:none; }
  .car .tag { position:absolute; left:16px; top:-30px; background:var(--c); color:#fff; padding:3px 8px;
    border-radius:8px; font-size:12px; font-weight:600; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.4);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; }
  .car .tag b { font-size:14px; margin-left:4px; font-variant-numeric:tabular-nums; }
  .car.me .arrow { width:30px; height:30px; left:-15px; top:-15px; border-color:var(--accent); }
  .car.stale { opacity:.45; }
  .leaflet-div-icon { background:none; border:0; }
</style>
</head>
<body>
<div id="map"></div>

<div id="join">
  <form id="joinForm">
    <h1>Race <span>Live</span></h1>
    <p>同一個房間代碼的人，會在地圖上即時看到彼此的位置和車速。<br>
      位置經由公開伺服器傳送，知道房間代碼的人都看得到，代碼請取得難猜一點。</p>
    <label>你的名字<input id="nameInput" maxlength="20" placeholder="例如：Tommy" required></label>
    <label>房間代碼<input id="roomInput" maxlength="32" placeholder="例如：test" required></label>
    <label style="display:flex;align-items:center;gap:8px;color:var(--fg);font-size:15px">
      <input id="demoInput" type="checkbox" style="width:auto;margin:0"> 加入 3 台模擬車（一個人測試用）</label>
    <button type="submit">開始分享位置</button>
    <button type="button" id="histBtn0" style="background:transparent;color:var(--fg);border:1px solid #444;font-weight:500">查看這支手機上的紀錄</button>
    <div id="joinErr"></div>
  </form>
</div>

<div id="top">
  <div id="conn" class="pill">連線中…</div>
  <button id="roomPill" class="pill" title="離開房間"><span id="roomName"></span><span class="x">離開</span></button>
  <div class="spacer"></div>
  <button id="followBtn" class="btn on">跟隨我</button>
  <button id="fitBtn" class="btn">全部</button>
  <button id="styleBtn" class="btn" style="display:none">街道</button>
</div>

<div id="bottom">
  <div id="list"></div>
  <div id="recBar">
    <button id="recBtn" class="btn">● 開始記錄</button>
    <button id="histBtn" class="btn">紀錄</button>
  </div>
  <div id="hud">
    <div id="mySpeed">0</div><div class="unit">km/h</div>
    <div class="meta"><div id="gpsInfo">等待 GPS…</div><div id="countInfo"></div></div>
  </div>
</div>

<div id="replay">
  <div id="rpList"></div>
  <div class="rpctl">
    <div class="r1"><b id="rpTitle"></b><button id="rpClose" class="btn">✕ 結束回放</button></div>
    <input id="rpSlider" type="range" min="0" max="100" value="0" step="0.1">
    <div class="r2"><button id="rpPlay" class="btn">▶</button><span id="rpTime">00:00 / 00:00</span><button id="rpRate" class="btn">1×</button></div>
  </div>
</div>

<div id="sheet" class="hidden">
  <div class="card">
    <div class="head"><b>這支手機上的紀錄</b><button id="sheetClose" class="btn">關閉</button></div>
    <div id="sessList"></div>
    <p class="hint">紀錄存在這支手機的瀏覽器裡。清除瀏覽器資料或換手機就會不見，重要的紀錄請匯出備份。
      CSV 可以用 Excel 開；GPX 是通用的軌跡格式，Google Earth、Strava 和多數 GPS 軟體都能讀。</p>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  const STALE_MS = 10_000;      // 超過 10 秒沒更新 → 灰掉
  const SEND_EVERY_MS = 1000;   // 最多每秒上傳一次
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // 每支手機固定一個 id，重新整理後還是同一台車
  let myId = store.get('rl.id');
  if (!myId) { myId = 'u-' + Math.random().toString(36).slice(2, 10); store.set('rl.id', myId); }
  $('nameInput').value = store.get('rl.name') || '';
  $('roomInput').value = new URLSearchParams(location.search).get('room') || store.get('rl.room') || '';

  // ---------- 地圖：有 Mapbox token 用 Mapbox，否則退回 OpenStreetMap ----------
  const MAPBOX_TOKEN = 'pk.eyJ1IjoiemVodWFxaW4iLCJhIjoiY213aGlsdm42MHBsbjMwcHAyaTl4dDU5OCJ9.aMS3CT6bhjVYFLjz-DPQww';
  const STYLES = [
    { name: '街道', url: 'mapbox://styles/mapbox/streets-v12' },
    { name: '深色', url: 'mapbox://styles/mapbox/dark-v11' },
    { name: '衛星', url: 'mapbox://styles/mapbox/satellite-streets-v12' },
  ];
  const START = [25.0330, 121.5654];
  const useMapbox = !!(MAPBOX_TOKEN && window.mapboxgl);
  const map = useMapbox ? makeMapbox() : makeLeaflet();

  function makeMapbox() {
    mapboxgl.accessToken = MAPBOX_TOKEN;
    let styleIdx = Math.min(+(store.get('rl.style') || 0), STYLES.length - 1) || 0;
    const m = new mapboxgl.Map({
      container: 'map', style: STYLES[styleIdx].url, center: [START[1], START[0]], zoom: 15,
      pitchWithRotate: false, dragRotate: false, attributionControl: true, language: 'zh-Hant',
    });
    m.touchZoomRotate.disableRotation();   // 地圖固定北朝上，箭頭方向才會對
    const lines = new Map();
    const drawLine = (key) => {
      if (!m.isStyleLoaded()) return;       // 樣式載入後 style.load 會再畫一次
      const { coords, color } = lines.get(key), id = 'rl-line-' + key;
      const data = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords.map(c => [c[1], c[0]]) } };
      if (m.getSource(id)) m.getSource(id).setData(data);
      else {
        m.addSource(id, { type: 'geojson', data });
        m.addLayer({ id, type: 'line', source: id, layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': color, 'line-width': 4, 'line-opacity': 0.7 } });
      }
    };
    m.on('style.load', () => lines.forEach((_v, k) => drawLine(k)));
    $('styleBtn').style.display = '';
    $('styleBtn').textContent = STYLES[styleIdx].name;
    $('styleBtn').onclick = () => {
      styleIdx = (styleIdx + 1) % STYLES.length;
      m.setStyle(STYLES[styleIdx].url, { diff: false });
      $('styleBtn').textContent = STYLES[styleIdx].name;
      store.set('rl.style', String(styleIdx));
    };
    return {
      setView: (lat, lng, z) => m.jumpTo({ center: [lng, lat], zoom: z }),
      panTo: (lat, lng) => m.easeTo({ center: [lng, lat], duration: 1000, easing: t => t }),
      getZoom: () => m.getZoom(),
      fitBounds(pts) {
        if (pts.length === 1) return m.easeTo({ center: [pts[0][1], pts[0][0]], zoom: 16 });
        const b = new mapboxgl.LngLatBounds();
        pts.forEach(p => b.extend([p[1], p[0]]));
        m.fitBounds(b, { padding: { top: 80, bottom: 260, left: 50, right: 50 }, maxZoom: 17, duration: 800 });
      },
      onUserDrag: (fn) => m.on('dragstart', fn),
      addMarker(lat, lng, html, isMe) {
        const el = document.createElement('div');
        el.innerHTML = html;
        if (isMe) el.style.zIndex = '10';
        const mk = new mapboxgl.Marker({ element: el, anchor: 'center' }).setLngLat([lng, lat]).addTo(m);
        return { el, setPos: (a, b) => mk.setLngLat([b, a]), remove: () => mk.remove() };
      },
      addLine(key, coords, color) { lines.set(key, { coords, color }); drawLine(key); },
      clearLines() {
        for (const k of lines.keys()) {
          const id = 'rl-line-' + k;
          try { if (m.getLayer(id)) m.removeLayer(id); if (m.getSource(id)) m.removeSource(id); } catch {}
        }
        lines.clear();
      },
    };
  }
  function makeLeaflet() {
    const m = L.map('map', { zoomControl: false }).setView(START, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
    return {
      setView: (lat, lng, z) => m.setView([lat, lng], z),
      panTo: (lat, lng) => m.panTo([lat, lng], { animate: true, duration: 1 }),
      getZoom: () => m.getZoom(),
      fitBounds: (pts) => m.fitBounds(pts, { padding: [60, 60], maxZoom: 17 }),
      onUserDrag: (fn) => m.on('dragstart', fn),
      addMarker(lat, lng, html, isMe) {
        const mk = L.marker([lat, lng], { icon: L.divIcon({ className: '', html, iconSize: [0, 0] }), zIndexOffset: isMe ? 1000 : 0 }).addTo(m);
        return { get el() { return mk.getElement(); }, setPos: (a, b) => mk.setLatLng([a, b]), remove: () => m.removeLayer(mk) };
      },
      _lines: [],
      addLine(_key, coords, color) { this._lines.push(L.polyline(coords, { color, weight: 4, opacity: 0.7 }).addTo(m)); },
      clearLines() { this._lines.forEach(l => m.removeLayer(l)); this._lines = []; },
    };
  }

  let follow = true;
  $('followBtn').onclick = () => { follow = !follow; $('followBtn').classList.toggle('on', follow); if (follow && me.lat) map.panTo(me.lat, me.lng); };
  $('fitBtn').onclick = () => {
    if (rp) { const a = []; for (const tr of rp.tracks.values()) tr.t.forEach((_, i) => { if (i % 10 === 0) a.push([tr.lat[i], tr.lng[i]]); }); if (a.length) map.fitBounds(a); return; }
    follow = false; $('followBtn').classList.remove('on');
    const pts = [...drivers.values()].filter(d => d.lat != null).map(d => [d.lat, d.lng]);
    if (me.lat != null) pts.push([me.lat, me.lng]);
    if (pts.length) map.fitBounds(pts);
  };
  map.onUserDrag(() => { follow = false; $('followBtn').classList.remove('on'); });

  // ---------- 車子標記（含平滑移動） ----------
  const drivers = new Map();   // 其他車手
  const me = { id: myId, name: '', color: '#ffcc00', lat: null, lng: null, speed: 0, heading: null, acc: null, updatedAt: 0 };

  function carHtml(d, isMe, extra = '') {
    const stale = !isMe && Date.now() - d.updatedAt > STALE_MS;
    const cls = ['car', isMe ? 'me' : '', d.heading == null ? 'noheading' : '', stale ? 'stale' : '', extra].join(' ');
    const rot = d.heading == null ? 0 : d.heading;
    return `<div class="${cls}" style="--c:${d.color}">
      <div class="arrow" style="transform:rotate(${rot}deg)"><svg viewBox="0 0 24 24"><path d="M12 2 L20 21 L12 16.5 L4 21 Z" fill="#fff"/></svg></div>
      <div class="tag">${esc(isMe ? '我' : d.name)}<b>${Math.round(d.speed || 0)}</b></div></div>`;
  }
  function ensureMarker(d, isMe) {
    if (!d.marker) {
      d.marker = map.addMarker(d.lat, d.lng, carHtml(d, isMe), isMe);
      d.shown = { lat: d.lat, lng: d.lng };
    }
  }
  function refreshIcon(d, isMe) {
    const el = d.marker && d.marker.el;
    if (el) el.innerHTML = carHtml(d, isMe);
  }
  // 每次收到新座標，用 ~1 秒把標記滑過去，看起來不會一格一格跳
  function moveTo(d, lat, lng) {
    d.from = { ...(d.shown || { lat, lng }) };
    d.to = { lat, lng };
    d.animStart = performance.now();
  }
  function animate(now) {
    for (const d of [me, ...drivers.values()]) {
      if (!d.marker || !d.to) continue;
      const k = Math.min(1, (now - d.animStart) / 1000);
      d.shown = { lat: d.from.lat + (d.to.lat - d.from.lat) * k, lng: d.from.lng + (d.to.lng - d.from.lng) * k };
      d.marker.setPos(d.shown.lat, d.shown.lng);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  function upsertDriver(s) {
    if (s.id === myId) return;
    let d = drivers.get(s.id);
    if (!d) { d = { ...s }; drivers.set(s.id, d); }
    else Object.assign(d, s);
    if (d.lat == null) return renderList();
    recordPoint(d);
    if (!d.marker) ensureMarker(d, false); else moveTo(d, d.lat, d.lng);
    refreshIcon(d, false);
    renderList();
  }
  function removeDriver(id) {
    const d = drivers.get(id);
    if (d && d.marker) d.marker.remove();
    drivers.delete(id);
    renderList();
  }

  // ---------- 排行列表 ----------
  function renderList() {
    const rows = [...drivers.values()].filter(d => d.lat != null)
      .sort((a, b) => (b.speed || 0) - (a.speed || 0));
    $('list').innerHTML = rows.map(d => {
      const stale = Date.now() - d.updatedAt > STALE_MS;
      const dist = me.lat != null ? fmtDist(haversine(me, d)) : '';
      return `<div class="row ${stale ? 'stale' : ''}" data-id="${esc(d.id)}">
        <span class="dot" style="background:${d.color}"></span>
        <span class="name">${esc(d.name)}<small>${stale ? '訊號中斷' : dist}</small></span>
        <span class="spd">${Math.round(d.speed || 0)} km/h</span></div>`;
    }).join('');
    $('countInfo').textContent = `房間內 ${drivers.size + 1} 人`;
  }
  $('list').onclick = (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const d = drivers.get(row.dataset.id); if (!d) return;
    follow = false; $('followBtn').classList.remove('on');
    map.setView(d.lat, d.lng, Math.max(map.getZoom(), 16));
  };
  setInterval(() => { for (const d of drivers.values()) refreshIcon(d, false); renderList(); }, 2000);

  // ---------- 連線 ----------
  // 透過公開 MQTT 伺服器（WebSocket over TLS）交換位置，不需要自己架後端
  const BROKER = (window.RACE_LIVE_BROKER) || 'wss://broker.hivemq.com:8884/mqtt';
  const NS = 'racelive-tw/v1';
  const PALETTE = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4',
    '#42d4f4', '#f032e6', '#9a6324', '#469990', '#000075', '#808000', '#c2185b'];
  function colorFor(id) { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
  me.color = colorFor(myId);

  let client = null, connected = false, joined = null;
  const topicOf = (id) => `${NS}/${encodeURIComponent(joined.room)}/${id}`;
  function join() {
    if (!joined || client) return;
    const c = client = mqtt.connect(BROKER, {
      clientId: 'rl-' + myId + '-' + Math.random().toString(36).slice(2, 6),
      clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 10000,
      will: { topic: topicOf(myId), payload: JSON.stringify({ id: myId, leave: true }), qos: 0, retain: false },
    });
    c.on('connect', () => {
      if (client !== c) return;
      connected = true;
      $('conn').textContent = '已連線'; $('conn').classList.add('ok');
      client.subscribe(`${NS}/${encodeURIComponent(joined.room)}/+`, { qos: 0 });
      sendPos(true);
      if (rec) publishCtl();
    });
    const down = () => { if (client !== c) return; connected = false; $('conn').textContent = '斷線，重連中…'; $('conn').classList.remove('ok'); };
    c.on('close', down);
    c.on('offline', down);
    c.on('error', down);
    c.on('message', (topic, buf) => {
      if (client !== c) return;
      if (topic === ctlTopic()) { let cm = null; try { cm = buf.length ? JSON.parse(buf.toString()) : null; } catch {} return onCtl(cm); }
      let s; try { s = JSON.parse(buf.toString()); } catch { return; }
      if (!s || typeof s.id !== 'string' || s.id === myId) return;
      if (s.leave) return removeDriver(s.id);
      const lat = +s.lat, lng = +s.lng;
      if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
      upsertDriver({
        id: s.id.slice(0, 40), name: String(s.name || '車手').slice(0, 20), color: colorFor(s.id),
        lat, lng, speed: Math.min(500, Math.max(0, +s.speed || 0)),
        heading: isFinite(+s.heading) && s.heading !== null ? +s.heading : null,
        acc: +s.acc || null, updatedAt: Date.now(),
      });
    });
  }
  // 60 秒沒消息就從地圖移除
  setInterval(() => { for (const [id, d] of drivers) if (Date.now() - d.updatedAt > 60_000) removeDriver(id); }, 10_000);
  window.addEventListener('pagehide', () => {
    try { if (connected) client.publish(topicOf(myId), JSON.stringify({ id: myId, leave: true })); } catch {}
  });

  // ---------- GPS ----------
  let lastFix = null, lastSent = 0;
  function onPosition(p) {
    const c = p.coords, t = p.timestamp || Date.now();
    let mps = (typeof c.speed === 'number' && c.speed >= 0) ? c.speed : null;
    // 有些瀏覽器不給 speed：用前後兩點距離 ÷ 時間自己算
    if (mps == null && lastFix && c.accuracy < 50) {
      const dt = (t - lastFix.t) / 1000;
      if (dt >= 0.5) mps = haversine(lastFix, { lat: c.latitude, lng: c.longitude }) / dt;
    }
    let heading = (typeof c.heading === 'number' && !isNaN(c.heading)) ? c.heading : null;
    if (heading == null && lastFix && mps != null && mps > 2) heading = bearing(lastFix, { lat: c.latitude, lng: c.longitude });
    lastFix = { lat: c.latitude, lng: c.longitude, t };

    const kmh = mps == null ? 0 : mps * 3.6;
    me.speed = me.speed * 0.4 + kmh * 0.6;          // 輕微平滑，避免數字亂跳
    if (me.speed < 2) me.speed = 0;                 // 靜止時 GPS 漂移不要顯示成在動
    me.heading = me.speed > 3 ? heading : me.heading;
    me.acc = c.accuracy; me.updatedAt = Date.now();

    const first = me.lat == null;
    me.lat = c.latitude; me.lng = c.longitude;
    if (first) { ensureMarker(me, true); if (!rp) map.setView(me.lat, me.lng, 16); }
    else moveTo(me, me.lat, me.lng);
    refreshIcon(me, true);
    if (follow && !rp) map.panTo(me.lat, me.lng);

    $('mySpeed').textContent = Math.round(me.speed);
    $('gpsInfo').textContent = `GPS 精度 ±${Math.round(c.accuracy)} m`;
    recordPoint(me);
    sendPos();
  }
  function sendPos(force) {
    const now = Date.now();
    if (!force && now - lastSent < SEND_EVERY_MS) return;
    if (!connected || me.lat == null) return;
    lastSent = now;
    client.publish(topicOf(myId), JSON.stringify({
      id: myId, name: me.name, lat: +me.lat.toFixed(6), lng: +me.lng.toFixed(6),
      speed: Math.round(me.speed * 10) / 10, heading: me.heading == null ? null : Math.round(me.heading), acc: me.acc == null ? null : Math.round(me.acc),
    }), { qos: 0 });
  }
  setInterval(() => sendPos(true), 5000);   // 停著不動也定期回報，讓別人知道你還在線
  function onGpsError(err) {
    const msg = { 1: '沒有定位權限，請到設定允許', 2: '暫時抓不到 GPS 訊號', 3: 'GPS 逾時，重試中' }[err.code] || err.message;
    $('gpsInfo').textContent = msg;
  }

  // ---------- 保持螢幕常亮（網頁版在背景會停止定位） ----------
  let wakeLock = null, watchId = null, demoTimer = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && joined) keepAwake(); });

  // ---------- 加入 ----------
  $('joinForm').onsubmit = (e) => {
    e.preventDefault();
    const name = $('nameInput').value.trim(), room = $('roomInput').value.trim().toLowerCase();
    if (!name || !room) return;
    if (!('geolocation' in navigator)) { $('joinErr').textContent = '這個瀏覽器不支援定位'; return; }
    if (!window.isSecureContext) { $('joinErr').textContent = '定位需要 HTTPS 網址（localhost 除外），請看 README'; return; }
    store.set('rl.name', name); store.set('rl.room', room);
    joined = { name, room }; me.name = name;
    $('roomName').textContent = '#' + room;
    $('join').style.display = 'none';
    watchId = navigator.geolocation.watchPosition(onPosition, onGpsError, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    keepAwake();
    join();
    if ($('demoInput').checked) startDemo();
  };


  // ---------- 離開房間 ----------
  $('roomPill').onclick = async () => {
    if (!joined) return;
    const msg = rec ? `你正在記錄中，離開會停止記錄並儲存。\n確定離開房間 #${joined.room}？` : `確定離開房間 #${joined.room}？`;
    if (!confirm(msg)) return;
    await leaveRoom();
  };
  async function leaveRoom() {
    if (rec) await stopRec();                              // 房主離開：先停止並存檔，通知大家
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    clearInterval(demoTimer); demoTimer = null;
    try { if (wakeLock) await wakeLock.release(); } catch {}
    wakeLock = null;
    if (client) {
      const c = client;
      try { if (connected) c.publish(topicOf(myId), JSON.stringify({ id: myId, leave: true })); } catch {}
      client = null; connected = false;
      setTimeout(() => { try { c.end(true); } catch {} }, 300);   // 讓「離開」訊息先送出
    }
    for (const id of [...drivers.keys()]) removeDriver(id);
    if (me.marker) { me.marker.remove(); me.marker = null; }
    Object.assign(me, { lat: null, lng: null, speed: 0, heading: null, acc: null, to: null, shown: null });
    lastFix = null; ctl = { state: 'idle' }; joined = null;
    $('mySpeed').textContent = '0';
    $('gpsInfo').textContent = '等待 GPS…';
    $('conn').textContent = '連線中…'; $('conn').classList.remove('ok');
    renderRec(); renderList();
    $('join').style.display = '';
  }

  // ---------- 示範模式：在自己附近放 3 台模擬車（只在本機顯示，不會上傳） ----------
  function startDemo() {
    const bots = ['阿明', 'Kevin', 'Amy'].map((n, i) => ({ id: 'demo-' + i, name: n + '(模擬)', r: 250 + i * 150, a: i * 2, base: 45 + i * 20 }));
    let t = 0;
    clearInterval(demoTimer);
    demoTimer = setInterval(() => {
      if (me.lat == null) return;
      t++;
      for (const [i, b] of bots.entries()) {
        const kmh = Math.max(5, b.base + 20 * Math.sin(t / 7 + i));
        b.a += (kmh / 3.6) / b.r;
        if (!b.c) b.c = { lat: me.lat, lng: me.lng };
        const mLng = 111320 * Math.cos(b.c.lat * Math.PI / 180);
        upsertDriver({
          id: b.id, name: b.name, color: colorFor(b.id),
          lat: b.c.lat + b.r * Math.sin(b.a) / 111320, lng: b.c.lng + b.r * Math.cos(b.a) / mLng,
          speed: kmh, heading: (360 - (b.a * 180 / Math.PI) % 360) % 360, acc: 5, updatedAt: Date.now(),
        });
      }
    }, 1000);
  }

  // =====================================================================
  // 記錄：房主按「開始記錄」→ 房主的手機把房間內每個人的位置/速度存起來 → 按「停止」
  // 房間的記錄狀態用 MQTT retained 訊息同步（後加入的人也看得到）
  // =====================================================================
  const REC_EVERY_MS = 900;          // 每人約每秒存一筆
  const HOST_TIMEOUT_MS = 60_000;    // 房主 60 秒沒心跳 → 視為已離開，別人可以重新開始
  let ctl = { state: 'idle' };       // 房間目前的記錄狀態
  let rec = null;                    // 我是房主且正在記錄時才有值
  const ctlTopic = () => joined ? `${NS}/${encodeURIComponent(joined.room)}/_ctl` : '';

  function ctlActive() { return ctl.state === 'rec' && Date.now() - (ctl.at || 0) < HOST_TIMEOUT_MS; }
  function publishCtl() {
    if (!connected) return;
    const msg = rec
      ? { state: 'rec', sid: rec.sid, host: myId, hostName: me.name, startedAt: rec.startedAt, at: Date.now() }
      : { state: 'idle', at: Date.now() };
    client.publish(ctlTopic(), JSON.stringify(msg), { qos: 1, retain: true });
    ctl = msg;
  }
  setInterval(() => { if (rec) publishCtl(); }, 10_000);   // 房主心跳

  function onCtl(c) {
    const prev = ctl;
    ctl = (c && typeof c === 'object') ? c : { state: 'idle' };
    // 我是房主、但頁面重新整理過 → 接續原本那場記錄
    if (ctl.state === 'rec' && ctl.host === myId && !rec && ctlActive()) startRec(ctl.sid, ctl.startedAt);
    // 別人接手了（例如我斷線太久）→ 我這邊停下來並存檔
    if (rec && ctl.state === 'rec' && ctl.host !== myId) stopRec(true);
    if (!rec && prev.state !== ctl.state && ctl.host !== myId) {
      if (ctl.state === 'rec' && ctlActive()) toast(`${ctl.hostName || '房主'} 開始記錄了`);
      else if (prev.state === 'rec') toast('記錄已結束');
    }
    renderRec();
  }

  async function startRec(resumeSid, resumeStartedAt) {
    if (rec) return;
    const sid = resumeSid || `${new Date().toISOString().replace(/[:.]/g, '-')}-${myId.slice(-4)}`;
    const old = resumeSid ? await DB.getSession(sid).catch(() => null) : null;
    rec = {
      sid, room: joined.room, hostName: me.name, startedAt: resumeStartedAt || Date.now(), endedAt: null,
      drivers: (old && old.drivers) || {}, count: (old && old.count) || 0, buf: [], last: {},
    };
    recordPoint(me);
    for (const d of drivers.values()) if (Date.now() - d.updatedAt < STALE_MS) recordPoint(d);
    publishCtl();
    await flushRec();
    renderRec();
    if (!resumeSid) toast('開始記錄，房間內所有人都看得到「記錄中」');
  }
  async function stopRec(silent) {
    if (!rec) return;
    rec.endedAt = Date.now();
    await flushRec();
    const n = Object.keys(rec.drivers).length, dur = rec.endedAt - rec.startedAt;
    rec = null;
    if (!silent) publishCtl();
    renderRec();
    toast(`已儲存紀錄：${fmtDur(dur)}，${n} 人`);
  }
  function recordPoint(d) {
    if (!rec || d.lat == null) return;
    const now = Date.now();
    if (now - (rec.last[d.id] || 0) < REC_EVERY_MS) return;
    rec.last[d.id] = now;
    rec.drivers[d.id] = { name: d.name || '車手', color: d.color };
    rec.buf.push([now, d.id, +d.lat.toFixed(6), +d.lng.toFixed(6),
      Math.round((d.speed || 0) * 10) / 10, d.heading == null ? null : Math.round(d.heading)]);
    rec.count++;
  }
  let flushing = false;
  async function flushRec() {
    if (!rec || flushing) return;
    flushing = true;
    const pts = rec.buf; rec.buf = [];
    try {
      if (pts.length) await DB.addChunk(rec.sid, pts);
      await DB.putSession({ sid: rec.sid, room: rec.room, hostName: rec.hostName, startedAt: rec.startedAt,
        endedAt: rec.endedAt || Date.now(), drivers: rec.drivers, count: rec.count, done: !!rec.endedAt });
    } catch (e) {
      rec.buf = pts.concat(rec.buf);   // 寫入失敗就留著下次再寫
      console.warn('記錄寫入失敗', e);
    }
    flushing = false;
  }
  setInterval(flushRec, 5000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushRec(); });

  function renderRec() {
    const b = $('recBtn');
    b.classList.remove('on-rec', 'other');
    if (rec) {
      b.classList.add('on-rec');
      b.textContent = `■ 停止記錄　${fmtDur(Date.now() - rec.startedAt)}`;
    } else if (ctlActive()) {
      b.classList.add('other');
      b.textContent = `● ${ctl.hostName || '房主'} 記錄中　${fmtDur(Date.now() - (ctl.startedAt || Date.now()))}`;
    } else {
      b.textContent = '● 開始記錄';
    }
  }
  setInterval(renderRec, 1000);
  $('recBtn').onclick = () => {
    if (rec) { if (confirm('確定要停止記錄嗎？')) stopRec(); return; }
    if (ctlActive()) { toast(`${ctl.hostName || '房主'} 正在記錄，只有他可以停止`); return; }
    if (!connected) { toast('還沒連上伺服器，請稍等'); return; }
    startRec();
  };

  // ---------- 儲存（IndexedDB，存在這支手機的瀏覽器裡） ----------
  const DB = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('racelive', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        db.createObjectStore('sessions', { keyPath: 'sid' });
        db.createObjectStore('chunks', { autoIncrement: true }).createIndex('sid', 'sid');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbp = null; rej(r.error); };
    }));
    const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const done = (t) => new Promise((res, rej) => { t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error); });
    return {
      async putSession(s) { const t = (await open()).transaction('sessions', 'readwrite'); t.objectStore('sessions').put(s); return done(t); },
      async addChunk(sid, points) { const t = (await open()).transaction('chunks', 'readwrite'); t.objectStore('chunks').add({ sid, points }); return done(t); },
      async getSession(sid) { return req((await open()).transaction('sessions').objectStore('sessions').get(sid)); },
      async listSessions() { return req((await open()).transaction('sessions').objectStore('sessions').getAll()); },
      async getPoints(sid) {
        const chunks = await req((await open()).transaction('chunks').objectStore('chunks').index('sid').getAll(sid));
        return chunks.flatMap(c => c.points);
      },
      async deleteSession(sid) {
        const t = (await open()).transaction(['sessions', 'chunks'], 'readwrite');
        t.objectStore('sessions').delete(sid);
        const r = t.objectStore('chunks').index('sid').getAllKeys(sid);
        r.onsuccess = () => r.result.forEach(k => t.objectStore('chunks').delete(k));
        return done(t);
      },
    };
  })();

  // 把一場紀錄整理成每個人一條軌跡，並算出最高速、距離、平均速度
  async function loadSession(sid) {
    const meta = await DB.getSession(sid);
    const pts = (await DB.getPoints(sid)).sort((a, b) => a[0] - b[0]);
    const tracks = new Map();
    for (const [t, id, lat, lng, spd, hdg] of pts) {
      let tr = tracks.get(id);
      if (!tr) {
        const info = (meta.drivers && meta.drivers[id]) || {};
        tr = { id, name: info.name || id, color: info.color || colorFor(id), t: [], lat: [], lng: [], spd: [], hdg: [], max: 0, dist: 0 };
        tracks.set(id, tr);
      }
      const n = tr.t.length;
      if (n) {
        const d = haversine({ lat: tr.lat[n - 1], lng: tr.lng[n - 1] }, { lat, lng });
        if (t - tr.t[n - 1] < 15_000 && d < 500) tr.dist += d;   // 斷訊造成的跳點不算距離
      }
      tr.t.push(t); tr.lat.push(lat); tr.lng.push(lng); tr.spd.push(spd); tr.hdg.push(hdg);
      if (spd > tr.max) tr.max = spd;
    }
    for (const tr of tracks.values()) {
      const secs = (tr.t[tr.t.length - 1] - tr.t[0]) / 1000;
      tr.avg = secs > 0 ? (tr.dist / secs) * 3.6 : 0;
    }
    const t0 = pts.length ? pts[0][0] : meta.startedAt, t1 = pts.length ? pts[pts.length - 1][0] : meta.endedAt;
    return { meta, tracks, t0, t1, count: pts.length };
  }

  // ---------- 紀錄清單 ----------
  async function openSheet() {
    $('sheet').classList.remove('hidden');
    $('sessList').innerHTML = '<p class="hint">讀取中…</p>';
    let list = [];
    try { list = await DB.listSessions(); } catch { $('sessList').innerHTML = '<p class="hint">這個瀏覽器無法存取紀錄（可能是無痕模式）。</p>'; return; }
    list.sort((a, b) => b.startedAt - a.startedAt);
    if (!list.length) { $('sessList').innerHTML = '<p class="hint">還沒有紀錄。加入房間後按「開始記錄」就會存在這支手機上。</p>'; return; }
    $('sessList').innerHTML = list.map(s => {
      const live = rec && rec.sid === s.sid;
      return `<div class="sess" data-sid="${esc(s.sid)}">
        <div class="t">${fmtDate(s.startedAt)}　#${esc(s.room)}${live ? '　<span style="color:#ff6b6b">● 記錄中</span>' : ''}</div>
        <div class="m">${fmtDur((s.endedAt || Date.now()) - s.startedAt)} · ${Object.keys(s.drivers || {}).length} 人 · ${s.count || 0} 筆
          <br>${Object.values(s.drivers || {}).map(d => esc(d.name)).join('、')}</div>
        <div class="acts">
          <button class="btn primary" data-act="play">▶ 回放</button>
          <button class="btn" data-act="csv">匯出 CSV</button>
          <button class="btn" data-act="gpx">匯出 GPX</button>
          ${live ? '' : '<button class="btn danger" data-act="del">刪除</button>'}
        </div></div>`;
    }).join('');
  }
  $('histBtn').onclick = openSheet;
  $('histBtn0').onclick = openSheet;
  $('sheetClose').onclick = () => $('sheet').classList.add('hidden');
  $('sheet').onclick = (e) => { if (e.target.id === 'sheet') $('sheet').classList.add('hidden'); };
  $('sessList').onclick = async (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const sid = btn.closest('.sess').dataset.sid, act = btn.dataset.act;
    if (rec && rec.sid === sid) await flushRec();
    if (act === 'del') {
      if (!confirm('確定刪除這筆紀錄？刪除後無法復原。')) return;
      await DB.deleteSession(sid); openSheet(); return;
    }
    const data = await loadSession(sid);
    if (!data.count) { toast('這筆紀錄沒有資料'); return; }
    const base = `race-${data.meta.room}-${fmtFileDate(data.meta.startedAt)}`;
    if (act === 'csv') downloadFile(base + '.csv', toCsv(data), 'text/csv;charset=utf-8');
    if (act === 'gpx') downloadFile(base + '.gpx', toGpx(data), 'application/gpx+xml');
    if (act === 'play') { $('sheet').classList.add('hidden'); startReplay(data); }
  };

  // ---------- 匯出 ----------
  function toCsv({ meta, tracks }) {
    const rows = [['時間', '經過秒數', '車手ID', '車手', '緯度', '經度', '車速(km/h)', '方向(度)']];
    const all = [];
    for (const tr of tracks.values()) tr.t.forEach((t, i) => all.push([t, tr, i]));
    all.sort((a, b) => a[0] - b[0]);
    for (const [t, tr, i] of all) {
      rows.push([new Date(t).toISOString(), ((t - meta.startedAt) / 1000).toFixed(1), tr.id, tr.name,
        tr.lat[i], tr.lng[i], tr.spd[i], tr.hdg[i] == null ? '' : tr.hdg[i]]);
    }
    const cell = (v) => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    return '﻿' + rows.map(r => r.map(cell).join(',')).join('\n');   // BOM 讓 Excel 正確顯示中文
  }
  function toGpx({ meta, tracks }) {
    const x = (s) => String(s).replace(/[<>&"']/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[ch]));
    const trks = [...tracks.values()].map(tr => `  <trk><name>${x(tr.name)}</name><trkseg>\n` +
      tr.t.map((t, i) => `    <trkpt lat="${tr.lat[i]}" lon="${tr.lng[i]}"><time>${new Date(t).toISOString()}</time>` +
        `<extensions><speed>${(tr.spd[i] / 3.6).toFixed(2)}</speed>${tr.hdg[i] == null ? '' : `<course>${tr.hdg[i]}</course>`}</extensions></trkpt>`).join('\n') +
      `\n  </trkseg></trk>`).join('\n');
    return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Race Live" xmlns="http://www.topografix.com/GPX/1/1">\n` +
      `  <metadata><name>${x('#' + meta.room + ' ' + fmtDate(meta.startedAt))}</name><time>${new Date(meta.startedAt).toISOString()}</time></metadata>\n${trks}\n</gpx>\n`;
  }
  function downloadFile(name, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  }

  // ---------- 回放 ----------
  const RATES = [1, 2, 4, 8, 16, 32];
  let rp = null, rp0gen = 0;
  function startReplay(data) {
    stopReplay();
    const { meta, tracks, t0, t1 } = data;
    rp = { gen: (rp0gen = (rp0gen || 0) + 1), meta, tracks, t0, t1, t: t0, playing: false, rateIdx: 2, lastNow: performance.now(), lastUi: 0, follow: null, markers: new Map() };
    document.body.classList.add('replaying');
    $('rpTitle').textContent = `#${meta.room}　${fmtDate(meta.startedAt)}`;
    $('rpSlider').max = ((t1 - t0) / 1000).toFixed(1);
    $('rpRate').textContent = RATES[rp.rateIdx] + '×';
    const all = [];
    for (const tr of tracks.values()) {
      const coords = tr.t.map((_, i) => [tr.lat[i], tr.lng[i]]);
      map.addLine(tr.id, coords, tr.color);
      for (let i = 0; i < coords.length; i += Math.max(1, Math.floor(coords.length / 50))) all.push(coords[i]);
      rp.markers.set(tr.id, map.addMarker(tr.lat[0], tr.lng[0], '', false));
    }
    if (all.length) map.fitBounds(all);
    rpRender(true);
    const gen = rp.gen;
    const loop = (now) => { if (!rp || rp.gen !== gen) return; rpTick(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  function stopReplay() {
    if (!rp) return;
    rp.markers.forEach(m => m.remove());
    map.clearLines();
    rp = null;
    document.body.classList.remove('replaying');
    if (!joined) $('join').style.display = '';
  }
  // 取出某人在時間 t 的位置（前後兩筆之間做內插）
  function sampleAt(tr, t) {
    const ts = tr.t, n = ts.length;
    if (!n || t < ts[0]) return null;
    let lo = 0, hi = n - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ts[mid] <= t) lo = mid; else hi = mid - 1; }
    const i = lo;
    if (i === n - 1 || ts[i + 1] - ts[i] > 15_000) {
      return { lat: tr.lat[i], lng: tr.lng[i], spd: t - ts[i] > 3000 ? 0 : tr.spd[i], hdg: tr.hdg[i], stale: t - ts[i] > 5000 };
    }
    const k = (t - ts[i]) / (ts[i + 1] - ts[i]);
    const h0 = tr.hdg[i], h1 = tr.hdg[i + 1];
    let hdg = h0 == null ? h1 : h1 == null ? h0 : h0 + ((((h1 - h0) % 360) + 540) % 360 - 180) * k;
    if (hdg != null) hdg = (hdg + 360) % 360;
    return { lat: tr.lat[i] + (tr.lat[i + 1] - tr.lat[i]) * k, lng: tr.lng[i] + (tr.lng[i + 1] - tr.lng[i]) * k,
      spd: tr.spd[i] + (tr.spd[i + 1] - tr.spd[i]) * k, hdg, stale: false };
  }
  function rpTick(now) {
    if (!rp) return;
    if (rp.playing) {
      rp.t += (now - rp.lastNow) * RATES[rp.rateIdx];
      if (rp.t >= rp.t1) { rp.t = rp.t1; rp.playing = false; $('rpPlay').textContent = '▶'; }
    }
    rp.lastNow = now;
    rpRender(false, now);
  }
  function rpRender(force, now = performance.now()) {
    const ui = force || now - rp.lastUi > 200;   // 文字和清單每 0.2 秒更新一次就夠
    const rows = [];
    for (const tr of rp.tracks.values()) {
      const s = sampleAt(tr, rp.t), mk = rp.markers.get(tr.id);
      const el = mk.el;
      if (!s) { if (el) el.style.display = 'none'; continue; }
      if (el) el.style.display = '';
      mk.setPos(s.lat, s.lng);
      if (ui && el) {
        el.innerHTML = carHtml({ name: tr.name, color: tr.color, speed: s.spd, heading: s.hdg, updatedAt: s.stale ? 0 : Date.now() }, false, 'rp');
      }
      rows.push({ tr, s });
      if (rp.follow === tr.id && ui) map.panTo(s.lat, s.lng);
    }
    if (!ui) return;
    rp.lastUi = now;
    const el = (rp.t - rp.t0) / 1000;
    if (!rp.dragging) $('rpSlider').value = el.toFixed(1);
    $('rpTime').textContent = `${fmtClock(el)} / ${fmtClock((rp.t1 - rp.t0) / 1000)}`;
    rows.sort((a, b) => (b.s.stale ? -1 : b.s.spd) - (a.s.stale ? -1 : a.s.spd));
    $('rpList').innerHTML = rows.map(({ tr, s }) => `<div class="row ${s.stale ? 'stale' : ''} ${rp.follow === tr.id ? 'following' : ''}" data-id="${esc(tr.id)}">
      <span class="dot" style="background:${tr.color}"></span>
      <span class="name">${esc(tr.name)}<small class="stat">最高 ${Math.round(tr.max)} · 平均 ${Math.round(tr.avg)} km/h · ${fmtDist(tr.dist)}</small></span>
      <span class="spd">${Math.round(s.spd)} km/h</span></div>`).join('');
  }
  $('rpPlay').onclick = () => {
    if (!rp) return;
    if (!rp.playing && rp.t >= rp.t1) rp.t = rp.t0;
    rp.playing = !rp.playing;
    rp.lastNow = performance.now();
    $('rpPlay').textContent = rp.playing ? '❚❚' : '▶';
  };
  $('rpRate').onclick = () => { if (!rp) return; rp.rateIdx = (rp.rateIdx + 1) % RATES.length; $('rpRate').textContent = RATES[rp.rateIdx] + '×'; };
  $('rpSlider').oninput = () => { if (!rp) return; rp.dragging = true; rp.t = rp.t0 + (+$('rpSlider').value) * 1000; rpRender(true); };
  $('rpSlider').onchange = () => { if (rp) rp.dragging = false; };
  $('rpClose').onclick = stopReplay;
  $('rpList').onclick = (e) => {
    const row = e.target.closest('.row'); if (!row || !rp) return;
    rp.follow = rp.follow === row.dataset.id ? null : row.dataset.id;
    toast(rp.follow ? '鏡頭跟著這台車' : '取消跟隨');
    rpRender(true);
  };

  // ---------- 小提示 ----------
  let toastTimer = null;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ---------- 工具 ----------
  function fmtDur(ms) {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
  }
  const fmtClock = (sec) => fmtDur(sec * 1000);
  function fmtDate(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
  function fmtFileDate(t) { const d = new Date(t), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
  function haversine(a, b) {
    const R = 6371000, toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function bearing(a, b) {
    const toR = Math.PI / 180, y = Math.sin((b.lng - a.lng) * toR) * Math.cos(b.lat * toR);
    const x = Math.cos(a.lat * toR) * Math.sin(b.lat * toR) - Math.sin(a.lat * toR) * Math.cos(b.lat * toR) * Math.cos((b.lng - a.lng) * toR);
    return (Math.atan2(y, x) / toR + 360) % 360;
  }
  function fmtDist(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`; }
  function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
})();
</script>
</body>
